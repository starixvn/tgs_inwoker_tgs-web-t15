include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t15
  
build:
  extends: .build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
  only:
    - release/current

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
  only:
    - master