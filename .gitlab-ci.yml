include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t15
  components_dev: lobby-t15
  components_staging: lobby-t15,lobby-dsite-t15
  components_prod: lobby-t15
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_UPDATE_FLAGS: "--remote --checkout --no-single-branch"

build:
  extends: .build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
  only:
    - release/current

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
  only:
    - master