include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t15
  
build:
  image: pgtgs/tgs-lobby-build:latest
  extends: .build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t15"
  only:
    - develop

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t15"
  only:
    - release/current

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t15"
  only:
    - master