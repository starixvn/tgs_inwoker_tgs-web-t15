include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t5
  components_dev: lobby-t5
  components_staging: lobby-gpi-t5,lobby-demo-t5
  components_prod: lobby-gpi-t5
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_UPDATE_FLAGS: "--remote --checkout --no-single-branch"
  API_BRANCH_VARIABLE: $CI_COMMIT_BRANCH

build:
  extends: .build
  only:
    - master
    - release/current
    - develop

deploy-dev:
  extends: .deploy-dev

deploy-staging:
  extends: .deploy-staging
      
deploy-prod:
  extends: .deploy-prod